name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Package tarball
        run: npm pack

      - name: Verify package installation
        run: |
          mkdir -p ../smoke-test
          cd ../smoke-test
          npm init -y
          npm install ../agy-resume/agy-resume-*.tgz
          npx agyr --help
          npx agy-resume --help
        shell: bash
